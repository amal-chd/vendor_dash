         "not mobile-friendly". Pinch-zoom must remain accessible on all pages.

    <!-- Fonts: preconnect + non-render-blocking load (display=swap).
         The CSS @import in index.css was causing 2 "render-blocking stylesheets"
         reported by PageSpeed / Okara. Moving here with <link> + display=swap
         lets the browser paint immediately with the fallback font while the
         webfont downloads in parallel (fixes FCP & LCP). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />

    </noscript>
    <link rel="preconnect" href="https://checkout.razorpay.com" />

    <!-- WebSite + SearchAction Schema -->

    <!-- FAQPage Schema (global common questions) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Kada Dine?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kada Dine is a cloud-based restaurant POS and management platform built for Indian restaurants, cafes, QSRs, retail, and grocery stores. It combines billing, QR digital menus, kitchen display systems (KDS), table management, inventory, CRM, and analytics in one system."
          }
        },
        {
          "@type": "Question",
          "name": "Does Kada Dine support GST billing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Kada Dine generates GST-compliant invoices with CGST/SGST/IGST breakdowns. It supports multiple tax rates per menu item and produces GST-ready reports for filing."
          }
        },
        {
          "@type": "Question",
          "name": "Does Kada Dine work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Kada Dine POS operates in offline mode during internet outages and automatically syncs all transactions to the cloud when connectivity is restored."
          }
        },
        {
          "@type": "Question",
          "name": "What is a QR menu system?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A QR menu system lets restaurant guests scan a QR code at their table using their smartphone, browse the digital menu with photos and descriptions, and place orders directly — without needing a physical menu or waiting for a waiter."
          }
        },
        {
          "@type": "Question",
          "name": "How does a Kitchen Display System (KDS) work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Kitchen Display System replaces paper KOT (Kitchen Order Ticket) slips. Orders appear instantly on a screen in the kitchen the moment they are placed at the POS or via QR menu, reducing errors and improving preparation speed."
          }
        },
        {
          "@type": "Question",
          "name": "Can Kada Dine manage multiple restaurant branches?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Kada Dine supports multi-location management with a single dashboard, consolidated revenue reports across branches, inter-branch stock transfers, and location-specific staff and menu configuration."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Kada Dine cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kada Dine offers monthly and annual subscription plans priced in INR. A 7-day free trial is available with no credit card required. See full pricing at https://kadadine.thekada.in/pricing"
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free trial for Kada Dine?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Kada Dine offers a 7-day free trial with no credit card required. Sign up at https://kadadine.thekada.in/signup"
          }
        }
      ]
    }
    </script>
